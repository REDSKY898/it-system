<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — Export รายงาน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
    .navbar {
      background: #1a1a2e; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: 600; }
    .btn-back {
      background: rgba(255,255,255,0.1); color: white;
      border: none; padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .card {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px; font-weight: 600; color: #1a1a1a;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 0.5px solid #eee;
    }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 10px 14px; border: 0.5px solid #ddd;
      border-radius: 10px; font-size: 14px; outline: none;
      font-family: inherit; background: white;
    }
    .form-input:focus { border-color: #1a1a2e; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn-pdf {
      flex: 1; padding: 12px; background: #E24B4A; color: white;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .btn-pdf:hover { background: #c93c3b; }
    .btn-excel {
      flex: 1; padding: 12px; background: #1D9E75; color: white;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .btn-excel:hover { background: #178a64; }
    .btn-disabled { background: #ccc !important; cursor: not-allowed !important; }
    .admin-only {
      font-size: 11px; color: #999; margin-top: 6px; text-align: center;
    }
    #msg {
      padding: 12px; border-radius: 10px; font-size: 14px;
      text-align: center; display: none; margin-top: 12px;
    }
    .msg-success { background: #E1F5EE; color: #085041; }
    .msg-error { background: #FCEBEB; color: #791F1F; }
    .loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 99;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    .loading-overlay.show { display: flex; }
    .loading-box {
      background: white; border-radius: 16px; padding: 32px 40px;
      text-align: center;
    }
    .loading-box p { font-size: 15px; color: #1a1a1a; margin-top: 12px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f0f4f8;
      border-top-color: #1a1a2e; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="navbar">
    <span class="navbar-brand">📊 Export รายงาน</span>
    <div style="display:flex;gap:8px">
  <button class="btn-back" onclick="history.back()">← กลับ</button>
  <button class="btn-back" onclick="location.href='dashboard.html'">🏠 หน้าแรก</button>
</div>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loading-text">กำลังสร้างรายงาน...</p>
    </div>
  </div>

  <div class="container">

    <!-- Export รายอุปกรณ์ -->
    <div class="card">
      <p class="card-title">📋 Export รายงานรายอุปกรณ์</p>
      <div class="form-group">
        <label class="form-label">รหัสอุปกรณ์</label>
        <select class="form-input" id="device-select">
          <option value="">-- เลือกอุปกรณ์ --</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-pdf" onclick="exportReport('devicePDF')">
          📄 PDF รายอุปกรณ์
        </button>
        <button class="btn-excel" id="btn-excel-device" onclick="exportReport('deviceExcel')">
          📊 Excel รายอุปกรณ์
        </button>
      </div>
      <p class="admin-only" id="excel-note"></p>
    </div>

    <!-- Export รายบุคคล -->
    <div class="card">
      <p class="card-title">👤 Export รายงานรายบุคคล</p>
      <div class="form-group">
        <label class="form-label">เลือกบุคคล</label>
        <select class="form-input" id="person-select">
          <option value="">-- เลือกบุคคล --</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-pdf" onclick="exportReport('personPDF')">
          📄 PDF รายบุคคล
        </button>
      </div>
    </div>

    <div id="msg"></div>

  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2ZJb0AJ5xDKezJEsiWJ9OEhxFRtNPJOePH2iHENSHOlDpZRMEJqfR3MgPN7UnYhu0PQ/exec';

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!user.email) { location.href = 'index.html'; }

    const isAdmin = user.role === 'admin';

    // ถ้าไม่ใช่ admin ซ่อนปุ่ม Excel
    if (!isAdmin) {
      document.getElementById('btn-excel-device').classList.add('btn-disabled');
      document.getElementById('btn-excel-device').onclick = null;
      document.getElementById('excel-note').textContent = '* Excel สำหรับ Admin เท่านั้น';
    }

    // โหลดรายการอุปกรณ์
    fetch(GAS_URL + '?action=getDevices')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const select = document.getElementById('device-select');
          data.devices.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.device_id;
            opt.textContent = d.device_id + ' — ' + d.name;
            select.appendChild(opt);
          });
        }
      });

    // โหลดรายชื่อบุคคล (admin เห็นทุกคน / user เห็นแค่ตัวเอง)
    if (isAdmin) {
      fetch(GAS_URL + '?action=getUsers')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const select = document.getElementById('person-select');
            data.users.forEach(u => {
              const opt = document.createElement('option');
              opt.value = u.email;
              opt.textContent = u.name + ' (' + u.email + ')';
              select.appendChild(opt);
            });
          }
        });
    } else {
      // user เห็นแค่ตัวเอง
      const select = document.getElementById('person-select');
      const opt = document.createElement('option');
      opt.value = user.email;
      opt.textContent = user.email;
      select.appendChild(opt);
    }

    async function exportReport(type) {
      let payload = {};
      let loadingText = 'กำลังสร้างรายงาน...';

      if (type === 'devicePDF' || type === 'deviceExcel') {
        const deviceId = document.getElementById('device-select').value;
        if (!deviceId) { showMsg('กรุณาเลือกอุปกรณ์', 'error'); return; }
        payload = { action: type === 'devicePDF' ? 'exportDevicePDF' : 'exportDeviceExcel', device_id: deviceId };
        loadingText = 'กำลังสร้างรายงาน ' + deviceId + '...';
      } else if (type === 'personPDF') {
        const email = document.getElementById('person-select').value;
        if (!email) { showMsg('กรุณาเลือกบุคคล', 'error'); return; }
        payload = { action: 'exportPersonPDF', email: email };
        loadingText = 'กำลังสร้างรายงาน ' + email + '...';
      }

      // แสดง loading
      document.getElementById('loading-text').textContent = loadingText;
      document.getElementById('loading').classList.add('show');

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          // Download file
          const bytes = Uint8Array.from(atob(data.base64), c => c.charCodeAt(0));
          const blob = new Blob([bytes], { type: data.mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = data.filename;
          a.click();
          URL.revokeObjectURL(url);
          showMsg('✅ Download สำเร็จ: ' + data.filename, 'success');
        } else {
          showMsg('❌ ' + data.message, 'error');
        }
      } catch(e) {
        showMsg('❌ เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
      } finally {
        document.getElementById('loading').classList.remove('show');
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.style.display = 'block';
      el.className = type === 'success' ? 'msg-success' : 'msg-error';
      el.textContent = text;
    }
  </script>

</body>
</html>
