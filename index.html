<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — เข้าสู่ระบบ</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1D9E75;
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    #g_signin { display: flex; justify-content: center; margin-bottom: 16px; }
    #msg {
      margin-top: 16px;
      font-size: 14px;
      color: #e53e3e;
      display: none;
      padding: 10px;
      background: #fff5f5;
      border-radius: 8px;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
    .loading {
      display: none;
      font-size: 14px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🖥️</div>
    <h1>IT Helpdesk</h1>
    <p class="subtitle">คณะเศรษฐศาสตร์ ศรีราชา มหาวิทยาลัยเกษตรศาสตร์ วิทยาเขตศรีราชา <br>เข้าสู่ระบบด้วยอีเมล @ku.th เท่านั้น</p>

    <div id="g_signin"></div>
    <div class="loading" id="loading">⏳ กำลังตรวจสอบ...</div>
    <div id="msg"></div>
    <p class="note">เฉพาะบุคลากร คณะเศรษฐศาสตร์ ศรีราชา เท่านั้น</p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRwYG6zliBbpSrQQzgTIVhFODMbe6Nfb5zG-AV_APAIuC-2HP2QJAb98FfKEYVC3vY/exec';
    const CLIENT_ID = '767597310474-euurrls08gs2ep2lss8kh43a6ilhdlv9.apps.googleusercontent.com';

    // ถ้า login อยู่แล้ว ไป dashboard เลย
    if (localStorage.getItem('user')) {
      location.href = 'dashboard.html';
    }

    // เมื่อ Google Sign In สำเร็จ
    function handleCredentialResponse(response) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('msg').style.display = 'none';

      // ถอดข้อมูลจาก JWT token
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const email = payload.email;
      const name = payload.name;

      // ตรวจ domain @ku.th ฝั่ง Frontend ก่อน
      if (!email.endsWith('@ku.th')) {
        document.getElementById('loading').style.display = 'none';
        showError('อีเมลต้องเป็น @ku.th เท่านั้น');
        return;
      }

      // ส่งไป GAS ตรวจ Whitelist
      fetch(GAS_URL + '?action=checkUser&email=' + email)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          if (data.success) {
            localStorage.setItem('user', JSON.stringify({
              email: data.email,
              name: data.name,
              role: data.role,
              phone: data.phone || '',
              department: data.department || '',
              position: data.position || '',
              online_contact: data.online_contact || ''
            }));
            location.href = 'dashboard.html';
          } else {
            showError(data.message);
          }
        })
        .catch(() => {
          document.getElementById('loading').style.display = 'none';
          showError('เกิดข้อผิดพลาด กรุณาลองใหม่');
        });
    }

    function showError(msg) {
      const el = document.getElementById('msg');
      el.style.display = 'block';
      el.textContent = msg;
    }

    // เริ่ม Google Sign In
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('g_signin'),
        { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' }
      );
    };
  </script>
</body>
</html>
