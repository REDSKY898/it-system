<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — เข้าสู่ระบบ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1D9E75;
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-login:hover { background: #178a64; }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
    #msg {
      margin-top: 16px;
      font-size: 14px;
      color: #e53e3e;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🖥️</div>
    <h1>IT Helpdesk</h1>
    <p>มหาวิทยาลัยเกษตรศาสตร์<br>เข้าสู่ระบบด้วยอีเมล @ku.th เท่านั้น</p>

    <button class="btn-login" onclick="signIn()">
      <img src="https://www.google.com/favicon.ico" width="20" height="20"/>
      เข้าสู่ระบบด้วย Google
    </button>

    <div id="msg"></div>
    <p class="note">เฉพาะบุคลากรที่ได้รับสิทธิ์เท่านั้น</p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRwYG6zliBbpSrQQzgTIVhFODMbe6Nfb5zG-AV_APAIuC-2HP2QJAb98FfKEYVC3vY/exec';

    function signIn() {
      // ทดสอบก่อน OAuth จริง
      const email = prompt('กรอกอีเมล @ku.th ของคุณ (ทดสอบ):');
      if (!email) return;

      fetch(GAS_URL + '?action=checkUser&email=' + email)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            localStorage.setItem('user', JSON.stringify(data));
            alert('ยินดีต้อนรับ ' + data.name);
          } else {
            document.getElementById('msg').style.display = 'block';
            document.getElementById('msg').textContent = data.message;
          }
        });
    }
  </script>
</body>
</html>
