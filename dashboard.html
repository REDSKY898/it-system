<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — หน้าหลัก</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
    .navbar {
      background: #1D9E75; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: 600; }
    .navbar-user { color: white; font-size: 14px; display: flex; align-items: center; gap: 12px; }
    .btn-logout {
      background: rgba(255,255,255,0.2); color: white; border: none;
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.3); }
    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .welcome { margin-bottom: 28px; }
    .welcome h2 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .welcome p { font-size: 14px; color: #666; }
    .menu-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .menu-card {
      background: white; border-radius: 16px; padding: 20px;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all 0.2s; display: flex; align-items: center;
      gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .menu-card:hover { border-color: #1D9E75; transform: translateY(-2px); }
    .menu-card.admin-card:hover { border-color: #1a1a2e; }
    .menu-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .menu-info h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
    .menu-info p { font-size: 13px; color: #888; }
  </style>
</head>
<body>

  <div class="navbar">
    <span class="navbar-brand">🖥️ IT Helpdesk</span>
    <div class="navbar-user">
      <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
      <span id="user-name">กำลังโหลด...</span>
    </div>
  </div>

  <div class="container">
    <div class="welcome">
      <h2 id="welcome-text">สวัสดี!</h2>
      <p id="welcome-date"></p>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <script>
    const userStr = localStorage.getItem('user');
    if (!userStr) { location.href = 'index.html'; }
    const user = JSON.parse(userStr);

    document.getElementById('user-name').textContent = user.name;
    document.getElementById('welcome-text').textContent = 'สวัสดี, ' + user.name;
    document.getElementById('welcome-date').textContent = new Date().toLocaleDateString('th-TH', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    const isAdmin = user.role === 'admin';
    const menus = [
      { icon: '🔧', bg: '#E1F5EE', title: 'แจ้งซ่อม', desc: 'แจ้งปัญหาอุปกรณ์', url: 'repair.html', show: true },
      { icon: '📦', bg: '#EEEDFE', title: 'ยืม-คืนอุปกรณ์', desc: 'ยืมหรือคืนอุปกรณ์', url: 'borrow.html', show: true },
      { icon: '💻', bg: '#E6F1FB', title: 'อุปกรณ์ของฉัน', desc: 'อุปกรณ์ประจำตัวของฉัน', url: 'mydevices.html', show: true },
      { icon: '🏃', bg: '#FAECE7', title: 'บันทึกงานหน้างาน', desc: 'Walk-in สำหรับทีม IT', url: 'walkin.html', show: isAdmin },
      { icon: '⚙️', bg: '#1a1a2e', title: 'Admin Panel', desc: 'จัดการระบบ', url: 'admin.html', show: isAdmin, light: true },
    ];

    document.getElementById('menu-grid').innerHTML = menus.filter(m => m.show).map(m => `
      <div class="menu-card ${m.light ? 'admin-card' : ''}" onclick="location.href='${m.url}'">
        <div class="menu-icon" style="background:${m.bg}">
          <span style="${m.light ? 'filter:invert(1)' : ''}">${m.icon}</span>
        </div>
        <div class="menu-info">
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
        </div>
      </div>`).join('');

    function logout() {
      localStorage.removeItem('user');
      location.href = 'index.html';
    }
  </script>

</body>
</html>
