<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — แจ้งซ่อม</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
    .navbar {
      background: #1D9E75; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: 600; }
    .btn-back {
      background: rgba(255,255,255,0.2); color: white;
      border: none; padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }
    .card {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px; font-weight: 600; color: #1a1a1a;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 0.5px solid #eee;
    }

    /* Toggle ประเภทอุปกรณ์ */
    .type-toggle {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .type-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid #ddd;
      background: white; font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: inherit; color: #666; transition: all 0.2s;
    }
    .type-btn.active {
      background: #1D9E75; color: white; border-color: #1D9E75;
    }

    .device-selected {
      display: flex; align-items: center; gap: 12px;
      background: #f0f4f8; border-radius: 10px; padding: 12px;
      margin-bottom: 16px;
    }
    .device-icon { font-size: 28px; }
    .device-info-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .device-info-code { font-size: 12px; color: #999; font-family: monospace; }
    .btn-change {
      margin-left: auto; font-size: 12px; color: #1D9E75;
      background: none; border: none; cursor: pointer;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      font-size: 13px; font-weight: 500; color: #444;
      margin-bottom: 6px; display: block;
    }
    .form-label span { color: #e53e3e; }
    .form-input {
      width: 100%; padding: 10px 14px; border: 0.5px solid #ddd;
      border-radius: 10px; font-size: 14px; outline: none;
      font-family: inherit; background: white; color: #1a1a1a;
    }
    .form-input:focus { border-color: #1D9E75; }
    textarea.form-input { height: 100px; resize: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Personal device box */
    .personal-box {
      background: #fff8f0; border: 1.5px solid #EF9F27;
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .personal-box .form-input:focus { border-color: #EF9F27; }

    .photo-grid {
      display: grid; grid-template-columns: repeat(5,1fr); gap: 8px;
    }
    .photo-slot {
      aspect-ratio: 1; border: 1.5px dashed #ddd; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; font-size: 20px;
      background: #fafafa; position: relative; overflow: hidden;
    }
    .photo-slot:hover { border-color: #1D9E75; background: #f0fdf8; }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
    .photo-slot input { display: none; }
    .photo-label { font-size: 10px; color: #999; margin-top: 4px; }
    .btn-submit {
      width: 100%; padding: 14px; background: #1D9E75; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 500;
      cursor: pointer; margin-top: 8px;
    }
    .btn-submit:hover { background: #178a64; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
    #msg {
      padding: 12px; border-radius: 10px; font-size: 14px;
      text-align: center; display: none; margin-top: 12px;
    }
    .msg-success { background: #E1F5EE; color: #085041; }
    .msg-error { background: #FCEBEB; color: #791F1F; }
    .note-personal {
      font-size: 12px; color: #EF9F27; font-weight: 500;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <span class="navbar-brand">🔧 แจ้งซ่อม</span>
    <div style="display:flex;gap:8px">
  <button class="btn-back" onclick="history.back()">← กลับ</button>
  <button class="btn-back" onclick="location.href='dashboard.html'">🏠 หน้าแรก</button>
</div>
  </div>

  <div class="container">
    <div class="card">
      <p class="card-title">อุปกรณ์ที่แจ้งซ่อม</p>

      <!-- Toggle ประเภท -->
      <div class="type-toggle">
        <button class="type-btn active" id="btn-system" onclick="switchType('system')">
          💻 อุปกรณ์ในระบบ
        </button>
        <button class="type-btn" id="btn-personal" onclick="switchType('personal')">
          👤 อุปกรณ์ส่วนตัว
        </button>
      </div>

      <!-- อุปกรณ์ในระบบ -->
      <div id="section-system">
        <div class="device-selected" id="device-selected">
          <span class="device-icon" id="rep-icon">📦</span>
          <div>
            <p class="device-info-name" id="rep-name">เลือกอุปกรณ์</p>
            <p class="device-info-code" id="rep-code">-</p>
          </div>
          <button class="btn-change" onclick="location.href='devices.html'">เปลี่ยน</button>
        </div>
      </div>

      <!-- อุปกรณ์ส่วนตัว -->
      <div id="section-personal" style="display:none">
        <div class="personal-box">
          <p class="note-personal">⚠️ กรอกข้อมูลอุปกรณ์ส่วนตัวให้ครบเพื่อให้ IT ระบุได้ถูกต้อง</p>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ยี่ห้อ <span>*</span></label>
              <input type="text" class="form-input" id="p-brand" placeholder="เช่น Acer, HP, Canon"/>
            </div>
            <div class="form-group">
              <label class="form-label">รุ่น</label>
              <input type="text" class="form-input" id="p-model" placeholder="เช่น Aspire 5"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ประเภทอุปกรณ์ <span>*</span></label>
              <select class="form-input" id="p-category">
                <option value="Notebook">Notebook</option>
                <option value="PC">PC</option>
                <option value="Printer">Printer</option>
                <option value="Monitor">Monitor</option>
                <option value="Mouse">Mouse</option>
                <option value="Keyboard">Keyboard</option>
                <option value="Phone">มือถือ</option>
                <option value="Tablet">Tablet</option>
                <option value="Other">อื่นๆ</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">สี / ลักษณะ</label>
              <input type="text" class="form-input" id="p-desc" placeholder="เช่น สีดำ สีเงิน"/>
            </div>
          </div>
        </div>
      </div>

      <!-- อาการ -->
      <div class="form-group">
        <label class="form-label">อาการที่พบ <span>*</span></label>
        <textarea class="form-input" id="symptom"
          placeholder="อธิบายอาการที่พบ เช่น หน้าจอกะพริบ เปิดไม่ติด ปริ้นไม่ได้..."></textarea>
      </div>

      <!-- รูปภาพ -->
      <div class="form-group">
        <label class="form-label">รูปภาพประกอบ (สูงสุด 5 รูป)</label>
        <div class="photo-grid">
          <div class="photo-slot" onclick="document.getElementById('photo1').click()">
            📷<span class="photo-label">รูปที่ 1</span>
            <input type="file" id="photo1" accept="image/*" onchange="previewPhoto(this,0)"/>
          </div>
          <div class="photo-slot" onclick="document.getElementById('photo2').click()">
            📷<span class="photo-label">รูปที่ 2</span>
            <input type="file" id="photo2" accept="image/*" onchange="previewPhoto(this,1)"/>
          </div>
          <div class="photo-slot" onclick="document.getElementById('photo3').click()">
            📷<span class="photo-label">รูปที่ 3</span>
            <input type="file" id="photo3" accept="image/*" onchange="previewPhoto(this,2)"/>
          </div>
          <div class="photo-slot" onclick="document.getElementById('photo4').click()">
            📷<span class="photo-label">รูปที่ 4</span>
            <input type="file" id="photo4" accept="image/*" onchange="previewPhoto(this,3)"/>
          </div>
          <div class="photo-slot" onclick="document.getElementById('photo5').click()">
            📷<span class="photo-label">รูปที่ 5</span>
            <input type="file" id="photo5" accept="image/*" onchange="previewPhoto(this,4)"/>
          </div>
        </div>
      </div>

      <button class="btn-submit" id="btn-submit" onclick="submitRepair()">
        📨 ส่งแจ้งซ่อม
      </button>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRwYG6zliBbpSrQQzgTIVhFODMbe6Nfb5zG-AV_APAIuC-2HP2QJAb98FfKEYVC3vY/exec';

    const ICONS = {
      'Notebook':'💻','Projector':'📽️','PC':'🖥️',
      'Adapter':'🔌','Camera':'📷','Mouse':'🖱️','default':'📦'
    };

    let currentType = 'system';

    const deviceStr = localStorage.getItem('selectedDevice');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (deviceStr) {
      const d = JSON.parse(deviceStr);
      document.getElementById('rep-icon').textContent = ICONS[d.category] || ICONS.default;
      document.getElementById('rep-name').textContent = d.name;
      document.getElementById('rep-code').textContent = d.device_id + ' · ' + d.krupha_no;
    }

    function switchType(type) {
      currentType = type;
      document.getElementById('btn-system').classList.toggle('active', type === 'system');
      document.getElementById('btn-personal').classList.toggle('active', type === 'personal');
      document.getElementById('section-system').style.display = type === 'system' ? 'block' : 'none';
      document.getElementById('section-personal').style.display = type === 'personal' ? 'block' : 'none';
    }

    function previewPhoto(input, index) {
      if (!input.files[0]) return;
      const slots = document.querySelectorAll('.photo-slot');
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        slots[index].innerHTML = '';
        slots[index].appendChild(img);
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function submitRepair() {
      const symptom = document.getElementById('symptom').value.trim();
      if (!symptom) { showMsg('กรุณากรอกอาการที่พบ', 'error'); return; }

      let device_id = '';
      let deviceLabel = '';

      if (currentType === 'system') {
        if (!deviceStr) { showMsg('กรุณาเลือกอุปกรณ์ก่อน', 'error'); return; }
        const device = JSON.parse(deviceStr);
        device_id = device.device_id;
        deviceLabel = device.name;
      } else {
        const brand = document.getElementById('p-brand').value.trim();
        const model = document.getElementById('p-model').value.trim();
        const category = document.getElementById('p-category').value;
        const desc = document.getElementById('p-desc').value.trim();
        if (!brand) { showMsg('กรุณากรอกยี่ห้ออุปกรณ์', 'error'); return; }
        device_id = '[ส่วนตัว]';
        deviceLabel = category + ' ' + brand + ' ' + model + (desc ? ' (' + desc + ')' : '');
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังส่ง...';

      const payload = {
        action: 'createTicket',
        device_id: device_id,
        device_label: deviceLabel,
        requester_email: user.email || '',
        symptom: symptom,
        is_personal: currentType === 'personal'
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          showMsg('✅ ส่งแจ้งซ่อมสำเร็จ! Ticket: ' + data.ticket_id, 'success');
          btn.textContent = '✅ ส่งแล้ว';
        } else {
          showMsg('❌ ' + data.message, 'error');
          btn.disabled = false;
          btn.textContent = '📨 ส่งแจ้งซ่อม';
        }
      } catch(e) {
        showMsg('❌ เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
        btn.disabled = false;
        btn.textContent = '📨 ส่งแจ้งซ่อม';
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.style.display = 'block';
      el.className = type === 'success' ? 'msg-success' : 'msg-error';
      el.textContent = text;
    }
  </script>

</body>
</html>
