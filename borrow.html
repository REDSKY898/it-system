<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — ยืมอุปกรณ์</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
    .navbar {
      background: #7F77DD; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: 600; }
    .btn-back {
      background: rgba(255,255,255,0.2); color: white;
      border: none; padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }
    .card {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px; font-weight: 600; color: #1a1a1a;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 0.5px solid #eee;
    }
    .device-selected {
      display: flex; align-items: center; gap: 12px;
      background: #f0f4f8; border-radius: 10px; padding: 12px;
      margin-bottom: 16px;
    }
    .device-icon { font-size: 28px; }
    .device-info-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .device-info-code { font-size: 12px; color: #999; font-family: monospace; }
    .btn-change {
      margin-left: auto; font-size: 12px; color: #7F77DD;
      background: none; border: none; cursor: pointer;
    }
    .status-box {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 16px;
      font-size: 14px; font-weight: 500;
    }
    .status-available { background: #E1F5EE; color: #085041; }
    .status-unavailable { background: #FAEEDA; color: #633806; }
    .status-room { background: #FCEBEB; color: #791F1F; }
    .form-group { margin-bottom: 16px; }
    .form-label {
      font-size: 13px; font-weight: 500; color: #444;
      margin-bottom: 6px; display: block;
    }
    .form-label span { color: #e53e3e; }
    .form-input {
      width: 100%; padding: 10px 14px; border: 0.5px solid #ddd;
      border-radius: 10px; font-size: 14px; outline: none;
      font-family: inherit; background: white; color: #1a1a1a;
    }
    .form-input:focus { border-color: #7F77DD; }
    textarea.form-input { height: 80px; resize: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit {
      width: 100%; padding: 14px; background: #7F77DD; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 500;
      cursor: pointer; margin-top: 8px;
    }
    .btn-submit:hover { background: #6b63c9; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
    .btn-queue {
      width: 100%; padding: 14px; background: #FAEEDA; color: #633806;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 500;
      cursor: pointer; margin-top: 8px;
    }
    .btn-queue:hover { background: #f0d9b5; }
    #msg {
      padding: 12px; border-radius: 10px; font-size: 14px;
      text-align: center; display: none; margin-top: 12px;
    }
    .msg-success { background: #E1F5EE; color: #085041; }
    .msg-error { background: #FCEBEB; color: #791F1F; }
    .no-device {
      text-align: center; padding: 20px; color: #999; font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <span class="navbar-brand">📦 ยืมอุปกรณ์</span>
    <button class="btn-back" onclick="location.href='dashboard.html'">← กลับ</button>
  </div>

  <div class="container">

    <!-- อุปกรณ์ที่เลือก -->
    <div class="card">
      <p class="card-title">อุปกรณ์ที่ต้องการยืม</p>
      <div id="device-section">
        <div class="no-device">
          กรุณาเลือกอุปกรณ์จากหน้ารายการก่อนครับ<br><br>
          <button onclick="location.href='devices.html'"
            style="padding:10px 20px;background:#7F77DD;color:white;border:none;border-radius:10px;cursor:pointer;font-size:14px">
            เลือกอุปกรณ์
          </button>
        </div>
      </div>
    </div>

    <!-- ฟอร์มยืม -->
    <div class="card" id="form-card" style="display:none">
      <p class="card-title">รายละเอียดการยืม</p>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">วันที่ต้องการยืม <span>*</span></label>
          <input type="date" class="form-input" id="borrow-date"/>
        </div>
        <div class="form-group">
          <label class="form-label">วันที่คืน (โดยประมาณ) <span>*</span></label>
          <input type="date" class="form-input" id="return-date"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">วัตถุประสงค์การยืม <span>*</span></label>
        <textarea class="form-input" id="purpose"
          placeholder="เช่น ใช้สำหรับการประชุมโครงการวิจัย..."></textarea>
      </div>

      <div id="action-btn"></div>
      <div id="msg"></div>
    </div>

  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRwYG6zliBbpSrQQzgTIVhFODMbe6Nfb5zG-AV_APAIuC-2HP2QJAb98FfKEYVC3vY/exec';

    const ICONS = {
      'Notebook':'💻','Projector':'📽️','PC':'🖥️',
      'Adapter':'🔌','Camera':'📷','Mouse':'🖱️','default':'📦'
    };

    const STATUS_LABEL = {
      'available': 'พร้อมยืม',
      'borrowed': 'ถูกยืมอยู่',
      'prep': 'อยู่ระหว่างเตรียมพร้อม',
      'assigned': 'ประจำตัวบุคคล',
      'room': 'ประจำห้อง ยืมไม่ได้'
    };

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!user.email) { location.href = 'index.html'; }

    // ตั้งวันที่เริ่มต้น
    const today = new Date().toISOString().split('T')[0];
    const nextWeek = new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0];

    // โหลดอุปกรณ์ที่เลือกไว้
    // รับ device_id จาก URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const deviceId = urlParams.get('id');

    // หาข้อมูลอุปกรณ์จาก selectedDevice หรือ id
    let deviceStr = localStorage.getItem('selectedDevice');
    if (deviceId && deviceStr) {
      const d = JSON.parse(deviceStr);
      if (d.device_id !== deviceId) {
        deviceStr = null; // ล้างถ้า id ไม่ตรง
      }
    }
    if (deviceStr) {
      const d = JSON.parse(deviceStr);
      const deviceSection = document.getElementById('device-section');

      // แสดงข้อมูลอุปกรณ์
      let statusClass = 'status-available';
      if (d.status === 'borrowed' || d.status === 'prep') statusClass = 'status-unavailable';
      if (d.type === 'room') statusClass = 'status-room';

      deviceSection.innerHTML = `
        <div class="device-selected">
          <span class="device-icon">${ICONS[d.category] || ICONS.default}</span>
          <div>
            <p class="device-info-name">${d.name}</p>
            <p class="device-info-code">${d.device_id} · ${d.krupha_no}</p>
          </div>
          <button class="btn-change" onclick="location.href='devices.html'">เปลี่ยน</button>
        </div>
        <div class="status-box ${statusClass}">
          ${d.type === 'room' ? '🚫' : d.status === 'available' ? '✅' : '⏳'}
          ${STATUS_LABEL[d.status] || d.status}
          ${d.type === 'room' ? ' — อุปกรณ์ประจำห้องไม่สามารถยืมได้' : ''}
        </div>`;

      // แสดงฟอร์มถ้ายืมได้หรือลงคิวได้
      if (d.type !== 'room') {
        document.getElementById('form-card').style.display = 'block';
        document.getElementById('borrow-date').value = today;
        document.getElementById('return-date').value = nextWeek;

        // ปุ่มตามสถานะ
        if (d.status === 'available') {
          document.getElementById('action-btn').innerHTML = `
            <button class="btn-submit" onclick="submitBorrow('borrow')">
              📦 ส่งคำขอยืม
            </button>`;
        } else {
          document.getElementById('action-btn').innerHTML = `
            <button class="btn-queue" onclick="submitBorrow('queue')">
              ⏳ ลงคิวรออุปกรณ์
            </button>`;
        }
      }
    }

    async function submitBorrow(type) {
      const borrowDate = document.getElementById('borrow-date').value;
      const returnDate = document.getElementById('return-date').v
