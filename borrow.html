<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk — ยืม-คืนอุปกรณ์</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
    .navbar {
      background: #7F77DD; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: 600; }
    .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

    /* Mode selector */
    .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .mode-btn {
      background: white; border: 2px solid #eee; border-radius: 16px;
      padding: 20px 16px; cursor: pointer; text-align: center;
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .mode-btn:hover { border-color: #7F77DD; transform: translateY(-2px); }
    .mode-btn.active { border-color: #7F77DD; background: #f5f4ff; }
    .mode-btn .mode-icon { font-size: 36px; margin-bottom: 8px; }
    .mode-btn .mode-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .mode-btn .mode-desc { font-size: 12px; color: #888; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 0.5px solid #eee; }
    .device-selected { display: flex; align-items: center; gap: 12px; background: #f0f4f8; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .device-icon { font-size: 28px; }
    .device-info-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .device-info-code { font-size: 12px; color: #999; font-family: monospace; }
    .btn-change { margin-left: auto; font-size: 12px; color: #7F77DD; background: none; border: none; cursor: pointer; }
    .status-box { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
    .status-available { background: #E1F5EE; color: #085041; }
    .status-unavailable { background: #FAEEDA; color: #633806; }
    .status-room { background: #FCEBEB; color: #791F1F; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; display: block; }
    .form-label span { color: #e53e3e; }
    .form-input { width: 100%; padding: 10px 14px; border: 0.5px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; font-family: inherit; background: white; color: #1a1a1a; }
    .form-input:focus { border-color: #7F77DD; }
    textarea.form-input { height: 80px; resize: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit { width: 100%; padding: 14px; background: #7F77DD; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { background: #6b63c9; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
    .btn-queue { width: 100%; padding: 14px; background: #FAEEDA; color: #633806; border: none; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn-queue:hover { background: #f0d9b5; }
    .btn-return { width: 100%; padding: 14px; background: #E6F1FB; color: #0C447C; border: none; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn-return:hover { background: #cde0f5; }
    #msg, #msg-return { padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; display: none; margin-top: 12px; }
    .msg-success { background: #E1F5EE; color: #085041; }
    .msg-error { background: #FCEBEB; color: #791F1F; }
    .no-device { text-align: center; padding: 20px; color: #999; font-size: 14px; }
    .loading { text-align: center; padding: 20px; color: #666; font-size: 14px; }

    /* Borrow list */
    .borrow-item { border: 0.5px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .borrow-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .borrow-id { font-family: monospace; font-size: 12px; color: #999; }
    .borrow-device { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .borrow-info { font-size: 12px; color: #666; display: flex; gap: 12px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .badge-approved { background: #E1F5EE; color: #085041; }
    .badge-returning { background: #E6F1FB; color: #0C447C; }
    .returning-note { margin-top: 10px; padding: 8px 12px; background: #E6F1FB; border-radius: 8px; font-size: 12px; color: #0C447C; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; border-radius: 16px; padding: 24px; width: 420px; max-width: 95vw; }
    .modal-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 0.5px solid #eee; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-cancel { padding: 9px 16px; background: #f0f4f8; color: #666; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
    .btn-confirm { padding: 9px 16px; background: #7F77DD; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
    #msg-modal { padding: 8px; border-radius: 8px; font-size: 12px; display: none; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="navbar">
    <span class="navbar-brand">📦 ยืม-คืนอุปกรณ์</span>
    <button class="btn-back" onclick="location.href='dashboard.html'">← กลับ</button>
  </div>

  <!-- Modal แจ้งคืน -->
  <div class="modal-overlay" id="return-modal">
    <div class="modal">
      <p class="modal-title">📬 แจ้งความต้องการคืนอุปกรณ์</p>
      <input type="hidden" id="return-borrow-id"/>
      <div class="form-group">
        <label class="form-label">วันที่จะนำมาคืน *</label>
        <input type="date" class="form-input" id="return-plan-date"/>
      </div>
      <div class="form-group">
        <label class="form-label">หมายเหตุ</label>
        <textarea class="form-input" id="return-note" style="height:70px;resize:none" placeholder="เช่น อุปกรณ์ปกติดี ไม่มีรอยขีดข่วน..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeReturnModal()">ยกเลิก</button>
        <button class="btn-confirm" onclick="submitReturn()">📬 แจ้งคืน</button>
      </div>
      <div id="msg-modal"></div>
    </div>
  </div>

  <div class="container">

    <!-- เลือกโหมด -->
    <div class="mode-selector">
      <div class="mode-btn active" id="btn-borrow-mode" onclick="switchMode('borrow')">
        <div class="mode-icon">📦</div>
        <div class="mode-title">ยืมอุปกรณ์</div>
        <div class="mode-desc">เลือกและยืมอุปกรณ์</div>
      </div>
      <div class="mode-btn" id="btn-return-mode" onclick="switchMode('return')">
        <div class="mode-icon">🔄</div>
        <div class="mode-title">คืนอุปกรณ์</div>
        <div class="mode-desc">แจ้งคืนที่ยืมอยู่</div>
      </div>
    </div>

    <!-- Panel: ยืม -->
    <div class="panel active" id="panel-borrow">
      <div class="card">
        <p class="card-title">อุปกรณ์ที่ต้องการยืม</p>
        <div id="device-section">
          <div class="loading">⏳ กำลังโหลดข้อมูลอุปกรณ์...</div>
        </div>
      </div>
      <div class="card" id="form-card" style="display:none">
        <p class="card-title">รายละเอียดการยืม</p>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">วันที่ต้องการยืม <span>*</span></label>
            <input type="date" class="form-input" id="borrow-date"/>
          </div>
          <div class="form-group">
            <label class="form-label">วันที่คืน (โดยประมาณ) <span>*</span></label>
            <input type="date" class="form-input" id="return-date"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">วัตถุประสงค์การยืม <span>*</span></label>
          <textarea class="form-input" id="purpose" placeholder="เช่น ใช้สำหรับการประชุมโครงการวิจัย..."></textarea>
        </div>
        <div id="action-btn"></div>
        <div id="msg"></div>
      </div>
    </div>

    <!-- Panel: คืน -->
    <div class="panel" id="panel-return">
      <div class="card">
        <p class="card-title">รายการที่กำลังยืมอยู่</p>
        <div id="return-list"><div class="loading">⏳ กำลังโหลด...</div></div>
      </div>
    </div>

  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRwYG6zliBbpSrQQzgTIVhFODMbe6Nfb5zG-AV_APAIuC-2HP2QJAb98FfKEYVC3vY/exec';

    const ICONS = { 'Notebook':'💻','Projector':'📽️','PC':'🖥️','Adapter':'🔌','Camera':'📷','Mouse':'🖱️','default':'📦' };
    const STATUS_LABEL = { 'available':'พร้อมยืม','borrowed':'ถูกยืมอยู่','prep':'อยู่ระหว่างเตรียมพร้อม','assigned':'ประจำตัวบุคคล','room':'ประจำห้อง ยืมไม่ได้' };

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!user.email) { location.href = 'index.html'; }

    const today = new Date().toISOString().split('T')[0];
    const nextWeek = new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0];
    document.getElementById('return-plan-date').value = today;

    // ตรวจสอบ URL param — ถ้ามี id ให้ไปโหมดยืม
    const urlParams = new URLSearchParams(window.location.search);
    const deviceId = urlParams.get('id');

    // โหลดอุปกรณ์สำหรับโหมดยืม
    if (deviceId) {
      fetch(GAS_URL + '?action=getDevices')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const device = data.devices.find(d => d.device_id === deviceId);
            device ? showDevice(device) : showNoDevice();
          } else { showNoDevice(); }
        }).catch(() => showNoDevice());
    } else {
      const deviceStr = localStorage.getItem('selectedDevice');
      deviceStr ? showDevice(JSON.parse(deviceStr)) : showNoDevice();
    }

    function switchMode(mode) {
      document.getElementById('btn-borrow-mode').classList.toggle('active', mode === 'borrow');
      document.getElementById('btn-return-mode').classList.toggle('active', mode === 'return');
      document.getElementById('panel-borrow').classList.toggle('active', mode === 'borrow');
      document.getElementById('panel-return').classList.toggle('active', mode === 'return');
      if (mode === 'return') loadMyBorrows();
    }

    // ==================== โหมดยืม ====================

    function showNoDevice() {
      document.getElementById('device-section').innerHTML = `
        <div class="no-device">
          กรุณาเลือกอุปกรณ์จากหน้ารายการก่อนครับ<br><br>
          <button onclick="location.href='devices.html'"
            style="padding:10px 20px;background:#7F77DD;color:white;border:none;border-radius:10px;cursor:pointer;font-size:14px">
            เลือกอุปกรณ์
          </button>
        </div>`;
    }

    function showDevice(d) {
      window.currentDevice = d;
      const deviceSection = document.getElementById('device-section');
      let statusClass = 'status-available';
      if (d.status === 'borrowed' || d.status === 'prep') statusClass = 'status-unavailable';
      if (d.type === 'room') statusClass = 'status-room';

      deviceSection.innerHTML = `
        <div class="device-selected">
          <span class="device-icon">${ICONS[d.category] || ICONS.default}</span>
          <div>
            <p class="device-info-name">${d.name}</p>
            <p class="device-info-code">${d.device_id} · ${d.krupha_no}</p>
          </div>
          <button class="btn-change" onclick="location.href='devices.html'">เปลี่ยน</button>
        </div>
        <div class="status-box ${statusClass}">
          ${d.type === 'room' ? '🚫' : d.status === 'available' ? '✅' : '⏳'}
          ${STATUS_LABEL[d.status] || d.status}
          ${d.type === 'room' ? ' — อุปกรณ์ประจำห้องไม่สามารถยืมได้' : ''}
        </div>`;

      if (d.type !== 'room') {
        document.getElementById('form-card').style.display = 'block';
        document.getElementById('borrow-date').value = today;
        document.getElementById('return-date').value = nextWeek;
        if (d.status === 'available') {
          document.getElementById('action-btn').innerHTML = `<button class="btn-submit" onclick="submitBorrow('borrow')">📦 ส่งคำขอยืม</button>`;
        } else {
          document.getElementById('action-btn').innerHTML = `<button class="btn-queue" onclick="submitBorrow('queue')">⏳ ลงคิวรออุปกรณ์</button>`;
        }
      }
    }

    async function submitBorrow(type) {
      const borrowDate = document.getElementById('borrow-date').value;
      const returnDate = document.getElementById('return-date').value;
      const purpose = document.getElementById('purpose').value.trim();
      if (!borrowDate) { showMsg('กรุณาเลือกวันที่ยืม', 'error'); return; }
      if (!returnDate) { showMsg('กรุณาเลือกวันที่คืน', 'error'); return; }
      if (!purpose) { showMsg('กรุณากรอกวัตถุประสงค์', 'error'); return; }
      if (returnDate < borrowDate) { showMsg('วันที่คืนต้องหลังวันที่ยืม', 'error'); return; }
      const d = window.currentDevice;
      if (!d) { showMsg('ไม่พบข้อมูลอุปกรณ์', 'error'); return; }
      const btn = document.querySelector('#panel-borrow .btn-submit, #panel-borrow .btn-queue');
      btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: type === 'borrow' ? 'createBorrow' : 'createQueue', device_id: d.device_id, borrower_email: user.email, borrow_date: borrowDate, due_date: returnDate, purpose })
        });
        const data = await res.json();
        if (data.success) {
          const id = data.borrow_id || data.queue_id;
          showMsg(type === 'borrow' ? '✅ ส่งคำขอยืมสำเร็จ! รอ Admin อนุมัติ ID: ' + id : '✅ ลงคิวสำเร็จ! ID: ' + id, 'success');
          btn.textContent = '✅ ส่งแล้ว';
        } else {
          showMsg('❌ ' + data.message, 'error');
          btn.disabled = false;
          btn.textContent = type === 'borrow' ? '📦 ส่งคำขอยืม' : '⏳ ลงคิวรออุปกรณ์';
        }
      } catch(e) {
        showMsg('❌ เกิดข้อผิดพลาด', 'error');
        btn.disabled = false;
        btn.textContent = type === 'borrow' ? '📦 ส่งคำขอยืม' : '⏳ ลงคิวรออุปกรณ์';
      }
    }

    // ==================== โหมดคืน ====================

    async function loadMyBorrows() {
      const el = document.getElementById('return-list');
      el.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
      try {
        const res = await fetch(GAS_URL + '?action=getBorrows');
        const data = await res.json();
        if (!data.success) { el.innerHTML = '<div class="no-device">ไม่สามารถโหลดข้อมูลได้</div>'; return; }

        const myBorrows = data.borrows.filter(b =>
          b.borrower_email === user.email &&
          (b.status === 'approved' || b.status === 'returning')
        ).reverse();

        if (!myBorrows.length) {
          el.innerHTML = '<div class="no-device" style="padding:30px">ไม่มีรายการที่ยืมอยู่</div>';
          return;
        }

        el.innerHTML = myBorrows.map(b => `
          <div class="borrow-item">
            <div class="borrow-header">
              <span class="borrow-id">${b.borrow_id}</span>
              <span class="badge badge-${b.status}">${b.status === 'approved' ? 'กำลังยืมอยู่' : '📬 แจ้งคืนแล้ว'}</span>
            </div>
            <p class="borrow-device">💻 ${b.device_id}</p>
            <div class="borrow-info">
              <span>📅 ยืม: ${formatDate(b.borrow_date)}</span>
              <span>📅 กำหนดคืน: ${formatDate(b.due_date)}</span>
            </div>
            ${b.status === 'approved' ? `
              <button class="btn-return" onclick="openReturnModal('${b.borrow_id}')">
                📬 แจ้งความต้องการคืนอุปกรณ์
              </button>` : ''}
            ${b.status === 'returning' ? `
              <div class="returning-note">⏳ แจ้งคืนแล้ว กำลังรอ IT รับอุปกรณ์</div>` : ''}
          </div>`).join('');
      } catch(e) {
        el.innerHTML = '<div class="no-device">❌ เกิดข้อผิดพลาด กรุณาลองใหม่</div>';
      }
    }

    function formatDate(dateVal) {
      if (!dateVal) return '-';
      try { return new Date(dateVal).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }); }
      catch(e) { return dateVal; }
    }

    function openReturnModal(borrowId) {
      document.getElementById('return-borrow-id').value = borrowId;
      document.getElementById('return-note').value = '';
      document.getElementById('return-plan-date').value = today;
      document.getElementById('msg-modal').style.display = 'none';
      document.getElementById('return-modal').classList.add('show');
    }

    function closeReturnModal() {
      document.getElementById('return-modal').classList.remove('show');
    }

    async function submitReturn() {
      const borrowId = document.getElementById('return-borrow-id').value;
      const planDate = document.getElementById('return-plan-date').value;
      const note = document.getElementById('return-note').value.trim();
      if (!planDate) { showModalMsg('กรุณาเลือกวันที่จะนำมาคืน', 'error'); return; }
      const btn = document.querySelector('#return-modal .btn-confirm');
      btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'requestReturn', borrow_id: borrowId, return_plan_date: planDate, note, borrower_email: user.email })
        });
        const data = await res.json();
        if (data.success) {
          showModalMsg('✅ แจ้งคืนสำเร็จ IT จะติดต่อกลับเร็วๆ นี้', 'success');
          btn.textContent = '✅ ส่งแล้ว';
          setTimeout(() => { closeReturnModal(); loadMyBorrows(); }, 1500);
        } else {
          showModalMsg('❌ ' + data.message, 'error');
          btn.disabled = false; btn.textContent = '📬 แจ้งคืน';
        }
      } catch(e) {
        showModalMsg('❌ เกิดข้อผิดพลาด', 'error');
        btn.disabled = false; btn.textContent = '📬 แจ้งคืน';
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.style.display = 'block'; el.className = type === 'success' ? 'msg-success' : 'msg-error'; el.textContent = text;
    }

    function showModalMsg(text, type) {
      const el = document.getElementById('msg-modal');
      el.style.display = 'block'; el.className = type === 'success' ? 'msg-success' : 'msg-error'; el.textContent = text;
    }
  </script>

</body>
</html>
